[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-acceptance-pack"
version = "0.1.0"
description = "Synthetic behavioral acceptance checks for coding agent updates"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
aap = "aap.cli:main"

[tool.setuptools.package-data]
aap = ["fixtures/*.json"]

[tool.setuptools.packages.find]
include = ["aap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
